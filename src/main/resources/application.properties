# Application
quarkus.application.name=inferences
quarkus.application.version=1.0.0-SNAPSHOT
quarkus.http.port=8080

# Mongo DB Configuration
quarkus.mongodb.connection-string=${DB_URL:mongodb://localhost:27017}
quarkus.mongodb.credentials.username=${DB_USER}
quarkus.mongodb.credentials.password=${DB_PASSWORD}
quarkus.mongodb.database=${DB_NAME:inferences}
quarkus.mongodb.credentials.auth-source=admin

# Logs
quarkus.log.category."org.mongodb.driver".level=WARN

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true

# Health
quarkus.smallrye-health.root-path=/q/health
